name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Settings require database credentials even for the unit tests.
  PULSE_DATABASE__DRIVER: postgresql+asyncpg
  PULSE_DATABASE__HOST: localhost
  PULSE_DATABASE__PORT: "5432"
  PULSE_DATABASE__USERNAME: postgres
  PULSE_DATABASE__PASSWORD: postgres
  PULSE_DATABASE__DB: pulsedb
  PULSE_DATABASE__ECHO: "false"
  PULSE_DATABASE__POOL_SIZE: "10"
  PULSE_DATABASE__MAX_OVERFLOW: "20"
  PULSE_DATABASE__POOL_TIMEOUT: "30"
  PULSE_DATABASE__POOL_RECYCLE: "1800"
  PULSE_DATABASE__POOL_PRE_PING: "true"
  PULSE_REDIS__HOST: localhost
  PULSE_REDIS__PORT: "6379"
  PULSE_REDIS__DB: "0"

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  e2e:
    name: End-to-end (real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsedb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations apply from scratch
        run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Smoke and chaos tests
        run: uv run pytest tests/e2e -v
        env:
          PULSE_E2E: "1"
          PULSE_E2E_LOGS: ${{ runner.temp }}/e2e-logs
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs

  # Real SNS signatures via LocalStack. Not yet proven on GitHub's runners
  # (the SNS -> Pulse callback needs host.docker.internal), so it can't fail the build.
  localstack:
    name: SES/SNS events (LocalStack)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    continue-on-error: true
    services:
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sns
        ports: ["4566:4566"]
        options: >-
          --add-host host.docker.internal:host-gateway
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/integration -v
        env:
          LOCALSTACK_URL: http://localhost:4566
