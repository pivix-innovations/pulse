[project]
name = "pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.8",
    "firebase-admin>=7.5.0",
    "greenlet>=3.5.2",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.39.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
