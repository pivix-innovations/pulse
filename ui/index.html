<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Console</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --border: #e4e7ec;
    --text: #101828;
    --muted: #667085;
    --faint: #98a2b3;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --accent-text: #4338ca;
    --green: #067647; --green-bg: #ecfdf3; --green-bd: #abefc6;
    --blue: #175cd3;  --blue-bg: #eff8ff;  --blue-bd: #b2ddff;
    --amber: #b54708; --amber-bg: #fffaeb; --amber-bd: #fedf89;
    --red: #b42318;   --red-bg: #fef3f2;   --red-bd: #fecdca;
    --gray: #475467;  --gray-bg: #f2f4f7;  --gray-bd: #e4e7ec;
    --shadow: 0 1px 2px rgba(16,24,40,.05);
    --shadow-lg: 0 12px 32px -8px rgba(16,24,40,.18);
    --radius: 10px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e13;
      --surface: #131720;
      --surface-2: #171c27;
      --border: #232a38;
      --text: #e6e9f0;
      --muted: #8b95a7;
      --faint: #5d6779;
      --accent: #6366f1;
      --accent-soft: #1e2142;
      --accent-text: #a5b4fc;
      --green: #75e0a7; --green-bg: #10281c; --green-bd: #1b4a32;
      --blue: #84caff;  --blue-bg: #102a43;  --blue-bd: #1b4368;
      --amber: #fec84b; --amber-bg: #2e2008; --amber-bd: #543b0a;
      --red: #f97066;   --red-bg: #35100d;   --red-bd: #5c1f1a;
      --gray: #98a2b3;  --gray-bg: #1c222e;  --gray-bd: #2b3342;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --shadow-lg: 0 12px 32px -8px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  .layout { display: flex; min-height: 100vh; }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: 232px; flex: 0 0 232px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 20px 14px;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #9333ea);
    display: grid; place-items: center; color: #fff;
  }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--faint); margin-top: -2px; }

  .nav { padding: 8px 12px; flex: 1; overflow-y: auto; }
  .nav-section {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); padding: 14px 10px 6px;
  }
  .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin: 1px 0;
    border-radius: 7px; color: var(--muted);
    text-decoration: none; font-weight: 500;
  }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { background: var(--accent-soft); color: var(--accent-text); }
  .nav a svg { flex: 0 0 16px; opacity: .85; }

  .sidebar-foot {
    border-top: 1px solid var(--border);
    padding: 12px 16px; font-size: 12px; color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .conn-dot.ok { background: #12b76a; }
  .conn-dot.bad { background: #f04438; }

  /* ── Main ────────────────────────────────────────────── */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .page-title { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .page-desc { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .apikey-wrap { position: relative; }
  .apikey-wrap input { padding-left: 30px; width: 210px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .apikey-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }

  .content { padding: 24px 28px 48px; max-width: 1200px; width: 100%; margin: 0 auto; }

  /* ── Primitives ──────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 20px; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .card-title { font-weight: 600; font-size: 14px; }
  .card-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .card-body { padding: 18px; }
  .card-body.flush { padding: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font: inherit; font-weight: 550; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: var(--red-bg); border-color: var(--red-bd); }
  .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  input, select, textarea {
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    outline: none; width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  textarea { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; resize: vertical; }
  label { display: block; font-size: 12.5px; font-weight: 550; color: var(--muted); margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 14px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); font-weight: 500; }
  .check input { width: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em;
    color: var(--faint); padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    white-space: nowrap;
  }
  tbody td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-2); }
  .table-wrap { overflow-x: auto; }


  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .catalog-card {
    display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer;
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: inherit; font: inherit;
  }
  .catalog-card:hover { border-color: var(--accent); background: var(--surface-2); }
  .catalog-card img, .provider-logo { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .catalog-card .name { font-weight: 600; }
  .catalog-card .desc { font-size: 12px; color: var(--muted, #667085); line-height: 1.4; }
  .provider-card { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .provider-card:last-child { border-bottom: 0; }
  .provider-card .grow { flex: 1; min-width: 0; }
  .chain { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
  .chain-head { font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .chain-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--surface-2); }
  .chain-item .rank { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; }
  .chain-item .provider-logo { width: 24px; height: 24px; border-radius: 6px; }
  .chain-item .grow { flex: 1; min-width: 0; }
  .chain-note { font-size: 12px; color: var(--muted, #667085); margin-top: 6px; }
  .secret-hint { font-size: 12px; color: var(--muted, #667085); margin-top: 4px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 550;
    border: 1px solid var(--gray-bd); background: var(--gray-bg); color: var(--gray);
    white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.green { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }
  .badge.blue  { background: var(--blue-bg);  border-color: var(--blue-bd);  color: var(--blue); }
  .badge.amber { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber); }
  .badge.red   { background: var(--red-bg);   border-color: var(--red-bd);   color: var(--red); }
  .badge.plain::before { display: none; }

  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .copy-id { cursor: pointer; border-bottom: 1px dashed var(--faint); }
  .copy-id:hover { color: var(--accent-text); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
  }
  .stat-label { font-size: 12px; font-weight: 550; color: var(--muted); }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat-hint { font-size: 11.5px; color: var(--faint); margin-top: 2px; }

  .empty {
    text-align: center; padding: 44px 20px; color: var(--muted);
  }
  .empty .empty-icon { margin-bottom: 10px; color: var(--faint); }
  .empty p { margin: 4px 0 0; font-size: 13px; }
  .empty .empty-title { font-weight: 600; color: var(--text); font-size: 14px; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ── Modal ───────────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(9,12,18,.55);
    display: grid; place-items: center; padding: 24px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg);
    width: 100%; max-width: 560px; max-height: 90vh;
    display: flex; flex-direction: column;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-title { font-weight: 650; font-size: 15px; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .x-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
  .x-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ── Login ───────────────────────────────────────────── */
  .login-screen {
    min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg); padding: 32px;
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-error {
    background: var(--red-bg); border: 1px solid var(--red-bd); color: var(--red);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px;
  }

  /* ── User / tenant controls ──────────────────────────── */
  .tenant-switch { width: auto; min-width: 160px; font-weight: 550; }
  .user-chip {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 10px 5px 6px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface); cursor: pointer;
  }
  .user-chip:hover { background: var(--surface-2); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9333ea);
    color: #fff; display: grid; place-items: center;
    font-size: 12px; font-weight: 650;
  }
  .user-name { font-size: 13px; font-weight: 550; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-lg);
    min-width: 200px; padding: 6px; font-size: 13px;
  }
  .menu button {
    display: block; width: 100%; text-align: left;
    background: none; border: none; font: inherit; color: var(--text);
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .menu button:hover { background: var(--surface-2); }
  .menu .menu-head { padding: 8px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .reveal-box {
    background: var(--amber-bg); border: 1px solid var(--amber-bd);
    border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-size: 13px;
  }
  .reveal-box .mono { font-size: 13px; word-break: break-all; user-select: all; }

  /* ── Toasts ──────────────────────────────────────────── */
  .toasts { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px; box-shadow: var(--shadow-lg);
    padding: 10px 16px; font-size: 13px; max-width: 380px;
    animation: slide-in .18s ease;
  }
  .toast.err { border-left-color: #f04438; }
  .toast.ok { border-left-color: #12b76a; }
  @keyframes slide-in { from { transform: translateY(8px); opacity: 0; } }

  /* ── Live feed ───────────────────────────────────────── */
  .feed { max-height: 480px; overflow-y: auto; }
  .feed-item {
    display: flex; gap: 12px; padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    animation: slide-in .18s ease;
  }
  .feed-item:last-child { border-bottom: 0; }
  .feed-icon {
    width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent-text);
    display: grid; place-items: center;
  }
  .feed-title { font-weight: 600; font-size: 13.5px; }
  .feed-body { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: pre-wrap; word-break: break-word; }
  .feed-meta { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  pre.json {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin: 0;
    font-size: 12px; overflow-x: auto;
  }

  .matrix td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .matrix td.zero { color: var(--faint); }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .content { padding: 16px; }
    .row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>

<div class="login-screen" id="login-screen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>
      </div>
      <div>
        <div class="brand-name">Pulse</div>
        <div class="brand-sub">Notification Console</div>
      </div>
    </div>
    <div class="login-error" id="login-error" hidden></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div>
</div>

<div class="layout" id="app-layout" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>
      </div>
      <div>
        <div class="brand-name">Pulse</div>
        <div class="brand-sub">Notification Console</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">Checking…</span>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title"></div>
        <div class="page-desc" id="page-desc"></div>
      </div>
      <div class="topbar-right">
        <select class="tenant-switch" id="tenant-switch" title="Acting tenant"></select>
        <div style="position:relative">
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar"></div>
            <span class="user-name" id="user-name"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="menu" id="user-menu" hidden>
            <div class="menu-head">
              <div style="font-weight:600" id="menu-email"></div>
              <div class="muted" style="font-size:12px" id="menu-role"></div>
            </div>
            <button id="pw-btn">Change password</button>
            <button id="logout-btn">Sign out</button>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script>
"use strict";

/* ═══ Utilities ═══════════════════════════════════════════ */

const $ = (sel, root = document) => root.querySelector(sel);
const API = "/api/v1";

const state = {
  me: null,        // { id, email, full_name, is_platform_admin, memberships: [...] }
  tenantId: null,  // acting tenant uuid
};

function currentMembership() {
  return (state.me?.memberships || []).find(m => m.tenant_id === state.tenantId) || null;
}
function isTenantAdmin() {
  return state.me?.is_platform_admin || currentMembership()?.role === "admin";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

// opts.meta -> resolves { data, total } where total comes from X-Total-Count.
async function api(path, opts = {}) {
  const { meta, ...fetchOpts } = opts;
  opts = fetchOpts;
  const res = await fetch(API + path, {
    credentials: "same-origin",
    ...opts,
    headers: {
      ...(state.tenantId ? { "X-Tenant-Id": state.tenantId } : {}),
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401 && !path.startsWith("/auth/")) {
    showLogin("Your session has expired — sign in again.");
    throw new Error("Not signed in");
  }
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON body */ }
  if (!res.ok) {
    const detail = data && data.detail
      ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
      : `${res.status} ${res.statusText}`;
    throw new Error(detail);
  }
  return meta ? { data, total: Number(res.headers.get("X-Total-Count") || 0) } : data;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
}

function shortId(id) {
  if (!id) return "—";
  const s = String(id);
  return `<span class="mono copy-id" data-copy="${esc(s)}" title="${esc(s)} — click to copy">${esc(s.slice(0, 8))}…</span>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-copy]");
  if (t) { navigator.clipboard.writeText(t.dataset.copy).then(() => toast("Copied to clipboard", "ok")); }
});

const STATUS_COLOR = {
  delivered: "green", completed: "green", dispatched: "blue", sent: "blue",
  processing: "blue", created: "", pending: "", retrying: "amber",
  failed: "red", dead: "red",
};
function badge(status) {
  return `<span class="badge ${STATUS_COLOR[status] ?? ""}">${esc(status)}</span>`;
}
function boolBadge(v) {
  return v ? `<span class="badge green plain">active</span>` : `<span class="badge plain">inactive</span>`;
}

function emptyState(title, hint) {
  return `<div class="empty">
    <div class="empty-icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></div>
    <p class="empty-title">${esc(title)}</p>
    <p>${esc(hint)}</p>
  </div>`;
}

/* ═══ Modal ═══════════════════════════════════════════════ */

function openModal(title, bodyHtml, { onSubmit, submitLabel = "Save" } = {}) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title">${esc(title)}</div>
        <button class="x-btn" data-close aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form class="modal-form" style="display:contents">
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>
  </div>`;
  const close = () => { root.innerHTML = ""; };
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  root.querySelector(".modal-backdrop").addEventListener("click", e => { if (e.target === e.currentTarget) close(); });
  root.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try { await onSubmit(new FormData(e.target), e.target); close(); }
    catch (err) { toast(err.message, "err"); }
    finally { btn.disabled = false; }
  });
  return { close };
}

function buildNav() {
  const sections = {};
  for (const [key, r] of Object.entries(routes)) {
    if (r.visible && !r.visible()) continue;
    (sections[r.section] ??= []).push([key, r]);
  }
  $("#nav").innerHTML = Object.entries(sections).map(([name, items]) => `
    <div class="nav-section">${esc(name)}</div>
    ${items.map(([key, r]) => `<a href="#/${key}" data-route="${key}">${r.icon}<span>${esc(r.title)}</span></a>`).join("")}
  `).join("");
}

let teardown = null;

function navigate() {
  const key = (location.hash.replace(/^#\//, "") || "overview").split("?")[0];
  let route = routes[key] || routes.overview;
  if (route.visible && !route.visible()) route = routes.overview;
  if (teardown) { try { teardown(); } catch {} teardown = null; }
  document.querySelectorAll(".nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.route === (routes[key] ? key : "overview")));
  $("#page-title").textContent = route.title;
  $("#page-desc").textContent = route.desc;
  const content = $("#content");
  content.innerHTML = "";
  teardown = route.render(content) || null;
}

window.addEventListener("hashchange", navigate);

/* ═══ Overview ════════════════════════════════════════════ */

function renderOverview(el) {
  el.innerHTML = `
    <div class="toolbar" style="margin-bottom:18px">
      <label style="margin:0">Window</label>
      <select id="window" style="width:auto">
        <option value="1">Last hour</option>
        <option value="6">Last 6 hours</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <button class="btn" id="refresh">Refresh</button>
    </div>
    <div id="metrics-area"><div class="empty muted">Loading metrics…</div></div>`;

  async function load() {
    const area = $("#metrics-area", el);
    try {
      const m = await api(`/metrics?window_hours=${$("#window", el).value}`);
      setConn(true);
      const totalNotifs = Object.values(m.notifications).reduce((a, b) => a + b, 0);
      const attemptTotals = {};
      for (const perChannel of Object.values(m.attempts)) {
        for (const [status, n] of Object.entries(perChannel)) {
          attemptTotals[status] = (attemptTotals[status] || 0) + n;
        }
      }
      const delivered = attemptTotals.delivered || 0;
      const attemptsAll = Object.values(attemptTotals).reduce((a, b) => a + b, 0);
      const statuses = ["pending", "sent", "delivered", "retrying", "failed", "dead"]
        .filter(s => attemptTotals[s] !== undefined || true);
      const channels = Object.keys(m.attempts);

      area.innerHTML = `
        <div class="stat-grid">
          <div class="stat"><div class="stat-label">Notifications</div><div class="stat-value">${totalNotifs}</div>
            <div class="stat-hint">${Object.entries(m.notifications).map(([k,v]) => `${v} ${k}`).join(" · ") || "none in window"}</div></div>
          <div class="stat"><div class="stat-label">Delivery attempts</div><div class="stat-value">${attemptsAll}</div>
            <div class="stat-hint">${delivered} confirmed delivered</div></div>
          <div class="stat"><div class="stat-label">Dead letters</div>
            <div class="stat-value" style="${m.dead_letters ? "color:var(--red)" : ""}">${m.dead_letters}</div>
            <div class="stat-hint">escalation exhausted</div></div>
          <div class="stat"><div class="stat-label">Avg confirmation</div>
            <div class="stat-value">${m.avg_confirmation_seconds == null ? "—" : m.avg_confirmation_seconds.toFixed(1) + "s"}</div>
            <div class="stat-hint">sent → delivered</div></div>
        </div>
        <div class="card">
          <div class="card-head"><div><div class="card-title">Attempts by channel</div>
            <div class="card-sub">Status breakdown per delivery channel over the selected window</div></div></div>
          <div class="card-body flush table-wrap">
            ${channels.length === 0 ? emptyState("No delivery attempts", "Send an event to see channel activity here.") : `
            <table class="matrix">
              <thead><tr><th>Channel</th>${statuses.map(s => `<th style="text-align:right">${esc(s)}</th>`).join("")}<th style="text-align:right">Total</th></tr></thead>
              <tbody>${channels.map(ch => {
                const row = m.attempts[ch];
                const tot = Object.values(row).reduce((a, b) => a + b, 0);
                return `<tr><td>${badge(chLabel(ch))}</td>
                  ${statuses.map(s => { const n = row[s] || 0; return `<td class="num ${n ? "" : "zero"}">${n}</td>`; }).join("")}
                  <td class="num" style="font-weight:600">${tot}</td></tr>`;
              }).join("")}</tbody>
            </table>`}
          </div>
        </div>`;
    } catch (err) {
      setConn(false);
      area.innerHTML = emptyState("Couldn't load metrics", err.message);
    }
  }
  $("#refresh", el).addEventListener("click", load);
  $("#window", el).addEventListener("change", load);
  load();
  const timer = setInterval(load, 30000);
  return () => clearInterval(timer);
}

function chLabel(ch) { return ch === "in_app" ? "in-app" : ch; }

/* ═══ Send Event ══════════════════════════════════════════ */

function renderSend(el) {
  el.innerHTML = `
    <div class="card" style="max-width:680px">
      <div class="card-head"><div><div class="card-title">Publish event</div>
        <div class="card-sub">Accepted events are resolved through the matching workflow and fanned out per channel.</div></div></div>
      <div class="card-body">
        <form id="send-form">
          <div class="row">
            <div class="field"><label>Event type</label><input name="event_type" required placeholder="user.signed_up" spellcheck="false"></div>
            <div class="field"><label>Source</label><input name="source" required placeholder="quotient" spellcheck="false"></div>
          </div>
          <div class="field"><label>Payload (JSON)</label>
            <textarea name="payload" rows="8" spellcheck="false">{
  "recipient_ref": "user-123",
  "name": "Ada"
}</textarea></div>
          <div class="row">
            <div class="field"><label>Idempotency key <span class="muted" style="font-weight:400">(optional)</span></label>
              <input name="idempotency_key" placeholder="unique-key" spellcheck="false"></div>
            <div class="field"><label>Schedule for <span class="muted" style="font-weight:400">(optional)</span></label>
              <input name="scheduled_at" type="datetime-local"></div>
          </div>
          <button class="btn primary" type="submit">${icons.send} Send event</button>
        </form>
      </div>
    </div>
    <div id="send-result"></div>`;

  $("#send-form", el).addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    let payload;
    try { payload = JSON.parse(fd.get("payload") || "{}"); }
    catch { toast("Payload is not valid JSON", "err"); return; }
    const body = {
      event_type: fd.get("event_type"),
      source: fd.get("source"),
      payload,
    };
    if (fd.get("idempotency_key")) body.idempotency_key = fd.get("idempotency_key");
    if (fd.get("scheduled_at")) body.scheduled_at = new Date(fd.get("scheduled_at")).toISOString();
    try {
      const res = await api("/events", { method: "POST", body: JSON.stringify(body) });
      toast("Event accepted", "ok");
      $("#send-result", el).innerHTML = `
        <div class="card" style="max-width:680px">
          <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div>
              <div style="font-weight:600">Notification created</div>
              <div class="muted" style="font-size:12.5px">${shortId(res.notification_id)} — ${badge("accepted")}</div>
            </div>
            <a class="btn" href="#/lookup?id=${esc(res.notification_id)}">Inspect delivery →</a>
          </div>
        </div>`;
    } catch (err) { toast(err.message, "err"); }
  });
}

/* ═══ Notification Lookup ═════════════════════════════════ */

function renderLookup(el) {
  const preset = new URLSearchParams(location.hash.split("?")[1] || "").get("id") || "";
  el.innerHTML = `
    <div class="card">
      <div class="card-body">
        <form id="lookup-form" class="toolbar">
          <input name="id" placeholder="Notification ID (UUID)" required spellcheck="false"
                 value="${esc(preset)}" style="flex:1;min-width:260px;font-family:ui-monospace,monospace;font-size:12.5px">
          <button class="btn primary" type="submit">Look up</button>
        </form>
      </div>
    </div>
    <div id="lookup-result"></div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">Recent notifications</div>
        <select id="recent-status">
          <option value="">All statuses</option>
          ${["created", "processing", "dispatched", "completed", "failed"].map(s => `<option value="${s}">${s}</option>`).join("")}
        </select>
      </div>
      <div class="card-body flush table-wrap" id="recent-list">${emptyState("Loading…", "")}</div>
      <div class="card-body toolbar" id="recent-pager" style="justify-content:space-between"></div>
    </div>`;

  const PAGE = 20;
  let recentOffset = 0;
  async function loadRecent() {
    const list = $("#recent-list", el), pager = $("#recent-pager", el);
    const status = $("#recent-status", el).value;
    try {
      const { data: items, total } = await api(
        `/notifications?limit=${PAGE}&offset=${recentOffset}${status ? `&status=${status}` : ""}`, { meta: true });
      if (items.length === 0) {
        list.innerHTML = emptyState("No notifications", "Send an event and it will show up here.");
        pager.innerHTML = "";
        return;
      }
      list.innerHTML = `<table>
        <thead><tr><th>Notification</th><th>Status</th><th>Created</th><th>Scheduled</th></tr></thead>
        <tbody>${items.map(n => `<tr data-open="${esc(n.id)}" style="cursor:pointer">
          <td>${shortId(n.id)}</td><td>${badge(n.status)}</td>
          <td class="muted">${esc(fmtDate(n.created_at))}</td>
          <td class="muted">${esc(fmtDate(n.scheduled_at))}</td></tr>`).join("")}</tbody></table>`;
      list.querySelectorAll("[data-open]").forEach(r => r.addEventListener("click", e => {
        if (e.target.closest("[data-copy]")) return;
        $("#lookup-form input[name=id]", el).value = r.dataset.open;
        load(r.dataset.open);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }));
      const to = Math.min(recentOffset + PAGE, total);
      pager.innerHTML = `<span class="muted">${recentOffset + 1}–${to} of ${total}</span>
        <span><button class="btn sm" id="prev" ${recentOffset === 0 ? "disabled" : ""}>Prev</button>
        <button class="btn sm" id="next" ${to >= total ? "disabled" : ""}>Next</button></span>`;
      $("#prev", pager).addEventListener("click", () => { recentOffset = Math.max(0, recentOffset - PAGE); loadRecent(); });
      $("#next", pager).addEventListener("click", () => { recentOffset += PAGE; loadRecent(); });
    } catch (err) { list.innerHTML = emptyState("Couldn't load notifications", err.message); }
  }
  $("#recent-status", el).addEventListener("change", () => { recentOffset = 0; loadRecent(); });

  async function load(id) {
    const out = $("#lookup-result", el);
    try {
      const n = await api(`/notifications/${encodeURIComponent(id.trim())}`);
      out.innerHTML = `
        <div class="stat-grid" style="margin-top:20px">
          <div class="stat"><div class="stat-label">Status</div><div style="margin-top:8px">${badge(n.status)}</div></div>
          <div class="stat"><div class="stat-label">Created</div><div class="stat-value" style="font-size:15px">${esc(fmtDate(n.created_at))}</div></div>
          <div class="stat"><div class="stat-label">Event</div><div style="margin-top:8px">${shortId(n.event_id)}</div></div>
          <div class="stat"><div class="stat-label">Workflow</div><div style="margin-top:8px">${shortId(n.workflow_id)}</div></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Delivery attempts (${n.attempts.length})</div></div>
          <div class="card-body flush table-wrap">
            ${n.attempts.length === 0 ? emptyState("No attempts yet", "Fan-out may still be in the outbox — check back shortly.") : `
            <table>
              <thead><tr><th>Attempt</th><th>Channel</th><th>Status</th><th>Tries</th><th>Sent</th><th>Delivered</th><th>Last error</th><th></th></tr></thead>
              <tbody>${n.attempts.map(a => `
                <tr>
                  <td>${shortId(a.id)}</td>
                  <td>${badge(chLabel(a.channel))}</td>
                  <td>${badge(a.status)}</td>
                  <td>${a.attempt_count}</td>
                  <td class="muted">${esc(fmtDate(a.sent_at))}</td>
                  <td class="muted">${esc(fmtDate(a.delivered_at))}</td>
                  <td class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.last_error || "")}">${esc(a.last_error || "—")}</td>
                  <td>${a.status === "sent" ? `<button class="btn sm" data-ack="${esc(a.id)}">Ack</button>` : ""}</td>
                </tr>`).join("")}</tbody>
            </table>`}
          </div>
        </div>`;
      out.querySelectorAll("[data-ack]").forEach(b => b.addEventListener("click", async () => {
        try {
          await api(`/notifications/${encodeURIComponent(id.trim())}/ack`, {
            method: "POST", body: JSON.stringify({ attempt_id: b.dataset.ack }),
          });
          toast("Attempt acknowledged as delivered", "ok");
          load(id);
        } catch (err) { toast(err.message, "err"); }
      }));
    } catch (err) {
      out.innerHTML = emptyState("Lookup failed", err.message);
    }
  }

  $("#lookup-form", el).addEventListener("submit", e => {
    e.preventDefault();
    load(new FormData(e.target).get("id"));
  });
  if (preset) load(preset);
  loadRecent();
}

/* ═══ Dead Letters ════════════════════════════════════════ */

function renderDeadLetters(el) {
  el.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Dead letters</div>
        <div class="card-sub">Deliveries that exhausted retries or could not be confirmed or escalated.</div></div>
        <button class="btn" id="refresh-btn">Refresh</button>
      </div>
      <div class="card-body flush table-wrap" id="dl-list">${emptyState("Loading…", "")}</div>
      <div class="card-body toolbar" id="dl-pager" style="justify-content:space-between"></div>
    </div>`;

  const PAGE = 20;
  let offset = 0;
  async function load() {
    const list = $("#dl-list", el), pager = $("#dl-pager", el);
    try {
      const { data: items, total } = await api(`/dead-letters?limit=${PAGE}&offset=${offset}`, { meta: true });
      if (items.length === 0 && offset === 0) {
        list.innerHTML = emptyState("No dead letters", "Every delivery is either in flight or accounted for.");
        pager.innerHTML = "";
        return;
      }
      list.innerHTML = `<table>
        <thead><tr><th>When</th><th>Channel</th><th>Notification</th><th>Attempt</th><th>Reason</th><th></th></tr></thead>
        <tbody>${items.map(d => `<tr>
          <td class="muted">${esc(fmtDate(d.created_at))}</td>
          <td>${badge(chLabel(d.channel))}</td>
          <td><a href="#/lookup?id=${esc(d.notification_id)}">${shortId(d.notification_id)}</a></td>
          <td>${shortId(d.attempt_id)}</td>
          <td style="max-width:360px;white-space:normal">${esc(d.reason)}</td>
          <td style="text-align:right"><button class="btn sm" data-retry="${esc(d.id)}">Retry</button></td></tr>`).join("")}</tbody></table>`;
      list.querySelectorAll("[data-retry]").forEach(b => b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          await api(`/dead-letters/${b.dataset.retry}/retry`, { method: "POST" });
          toast("Re-queued for delivery", "ok");
          load();
        } catch (err) { toast(err.message, "err"); b.disabled = false; }
      }));
      const to = Math.min(offset + PAGE, total);
      pager.innerHTML = `<span class="muted">${offset + 1}–${to} of ${total}</span>
        <span><button class="btn sm" id="prev" ${offset === 0 ? "disabled" : ""}>Prev</button>
        <button class="btn sm" id="next" ${to >= total ? "disabled" : ""}>Next</button></span>`;
      $("#prev", pager).addEventListener("click", () => { offset = Math.max(0, offset - PAGE); load(); });
      $("#next", pager).addEventListener("click", () => { offset += PAGE; load(); });
    } catch (err) { list.innerHTML = emptyState("Couldn't load dead letters", err.message); }
  }
  $("#refresh-btn", el).addEventListener("click", load);
  load();
}

/* ═══ Live SSE Stream ═════════════════════════════════════ */

function renderLive(el) {
  el.innerHTML = `
    <div class="card">
      <div class="card-body">
        <form id="live-form" class="toolbar">
          <input name="recipient" placeholder="Recipient external ref (e.g. user-123)" required spellcheck="false"
                 value="${esc(localStorage.getItem("pulse.liveRecipient") || "")}" style="flex:1;min-width:220px">
          <label class="check" style="margin:0"><input type="checkbox" name="replay" checked> Replay unconfirmed</label>
          <label class="check" style="margin:0"><input type="checkbox" name="autoack"> Auto-ack</label>
          <button class="btn primary" type="submit" id="live-btn">Connect</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">Incoming notifications</div>
        <span class="badge plain" id="live-status">disconnected</span>
      </div>
      <div class="card-body flush feed" id="feed">
        ${emptyState("Not connected", "Connect as a recipient to watch in-app notifications arrive in real time.")}
      </div>
    </div>`;

  let es = null;
  const feed = $("#feed", el);
  const statusEl = $("#live-status", el);

  function setStatus(txt, cls) {
    statusEl.textContent = txt;
    statusEl.className = `badge plain ${cls || ""}`;
  }

  function disconnect() {
    if (es) { es.close(); es = null; }
    setStatus("disconnected", "");
    $("#live-btn", el).textContent = "Connect";
  }

  $("#live-form", el).addEventListener("submit", e => {
    e.preventDefault();
    if (es) { disconnect(); return; }
    const fd = new FormData(e.target);
    const recipient = fd.get("recipient").trim();
    localStorage.setItem("pulse.liveRecipient", recipient);
    const autoack = fd.get("autoack") === "on";
    const url = `${API}/sse/stream?recipient=${encodeURIComponent(recipient)}`
      + `&tenant=${encodeURIComponent(state.tenantId)}`
      + (fd.get("replay") === "on" ? "&replay=1" : "");
    es = new EventSource(url);
    setStatus("connecting…", "amber");
    $("#live-btn", el).textContent = "Disconnect";
    es.onopen = () => setStatus("live", "green");
    es.onerror = () => { if (es) setStatus("reconnecting…", "amber"); };
    es.addEventListener("notification", ev => {
      let data = {};
      try { data = JSON.parse(ev.data); } catch {}
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const item = document.createElement("div");
      item.className = "feed-item";
      item.innerHTML = `
        <div class="feed-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
        <div style="flex:1;min-width:0">
          <div class="feed-title">${esc(data.title || "Notification")}</div>
          <div class="feed-body">${esc(data.body || "")}</div>
          <div class="feed-meta">
            <span>${new Date().toLocaleTimeString()}</span>
            ${data.replayed ? '<span class="badge amber plain">replayed</span>' : ""}
            ${data.notification_id ? shortId(data.notification_id) : ""}
            ${data.id && data.notification_id ? `<button class="btn sm" data-ack>Ack delivered</button>` : ""}
          </div>
        </div>`;
      const ackBtn = item.querySelector("[data-ack]");
      const doAck = async () => {
        try {
          await api(`/notifications/${encodeURIComponent(data.notification_id)}/ack`, {
            method: "POST", body: JSON.stringify({ attempt_id: data.id }),
          });
          if (ackBtn) ackBtn.outerHTML = '<span class="badge green plain">delivered</span>';
        } catch (err) { toast(err.message, "err"); }
      };
      if (ackBtn) ackBtn.addEventListener("click", doAck);
      if (autoack && data.id && data.notification_id) doAck();
      feed.prepend(item);
      while (feed.children.length > 100) feed.lastChild.remove();
    });
  });

  return disconnect;
}

/* ═══ Workflows ═══════════════════════════════════════════ */

const WORKFLOW_DEF_PLACEHOLDER = `{
  "channels": [
    {"channel": "in_app", "template": "welcome-inapp"},
    {"channel": "email", "template": "welcome-email"}
  ],
  "fallbacks": {"in_app": "email"}
}`;

/* Per-channel provider chain: saved providers in priority order (first is tried first). */
function chainEditorHtml() {
  return `<div id="chain-editor"></div><input type="hidden" name="provider_chains" value="{}">`;
}

function mountChainEditor(root, saved, initial, channelsOf) {
  const host = root.querySelector("#chain-editor");
  const hidden = root.querySelector('input[name="provider_chains"]');
  const textarea = root.querySelector('textarea[name="definition"]');
  const chains = JSON.parse(JSON.stringify(initial || {}));
  const byId = Object.fromEntries(saved.map(p => [p.id, p]));

  const channels = () => {
    try { return channelsOf(JSON.parse(textarea.value)); } catch { return Object.keys(chains); }
  };
  const draw = () => {
    hidden.value = JSON.stringify(Object.fromEntries(Object.entries(chains).filter(([, v]) => v.length)));
    const chs = channels();
    host.innerHTML = `<div class="field"><label>Providers</label>
      <div class="secret-hint" style="margin:-2px 0 8px">Pick saved providers for each channel. They're tried top to bottom; the next one is used only if the one above fails or times out.</div></div>` +
      chs.map(ch => {
        const ids = chains[ch] || [];
        const options = saved.filter(p => p.channel === ch && p.is_active && !ids.includes(p.id));
        return `<div class="chain" data-ch="${ch}">
          <div class="chain-head"><span>${badge(chLabel(ch))}</span></div>
          ${ids.map((id, i) => { const p = byId[id]; return `
            <div class="chain-item">
              <span class="rank">${i + 1}</span>
              ${p ? logoImg(p) : ""}
              <span class="grow">${p ? esc(p.label) : `<span class="muted">Unknown provider</span>`}</span>
              <button type="button" class="btn sm" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
              <button type="button" class="btn sm" data-down="${i}" ${i === ids.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
              <button type="button" class="btn sm danger" data-rm="${i}" aria-label="Remove">✕</button>
            </div>`; }).join("")}
          ${options.length ? `<select data-add><option value="">+ Add a provider…</option>${options.map(p => `<option value="${esc(p.id)}">${esc(p.label)} (${esc(p.catalog?.name || p.name)})</option>`).join("")}</select>` : ""}
          ${!ids.length ? `<div class="chain-note">${options.length ? "No provider chosen — this channel uses your default." : `No saved ${chLabel(ch)} providers. Add one on the Providers page.`}</div>` : ""}
        </div>`;
      }).join("");
    host.querySelectorAll(".chain").forEach(box => {
      const ch = box.dataset.ch;
      box.querySelector("[data-add]")?.addEventListener("change", e => {
        if (e.target.value) { (chains[ch] ||= []).push(e.target.value); draw(); }
      });
      box.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { chains[ch].splice(+b.dataset.rm, 1); draw(); }));
      box.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.up; [chains[ch][i - 1], chains[ch][i]] = [chains[ch][i], chains[ch][i - 1]]; draw(); }));
      box.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.down; [chains[ch][i + 1], chains[ch][i]] = [chains[ch][i], chains[ch][i + 1]]; draw(); }));
    });
  };
  textarea.addEventListener("change", draw);
  draw();
}

const workflowChannels = def => [...new Set([...(def.channels || []), ...(def.fallback_templates || [])].map(c => c.channel))];

async function openWorkflowModal(title, w, { submitLabel, onSubmit }) {
  let saved = [];
  try { saved = await api("/providers"); } catch { /* chain editor degrades to empty */ }
  const def = w?.definition ? { ...w.definition } : null;
  const chains = def?.provider_chains || {};
  if (def) delete def.provider_chains;   // edited via the chain editor, not the JSON box
  openModal(title, workflowForm({ ...(w || {}), definition: def }) + chainEditorHtml(), { submitLabel, onSubmit });
  mountChainEditor($("#modal-root"), saved, chains, workflowChannels);
}

function workflowForm(w = {}) {
  return `
    <div class="row">
      <div class="field"><label>Name</label><input name="name" required value="${esc(w.name || "")}" placeholder="welcome"></div>
      <div class="field"><label>Event type</label><input name="event_type" required value="${esc(w.event_type || "")}" placeholder="user.signed_up"></div>
    </div>
    <div class="field"><label>Definition (JSON)</label>
      <textarea name="definition" rows="12" required spellcheck="false">${esc(w.definition ? JSON.stringify(w.definition, null, 2) : WORKFLOW_DEF_PLACEHOLDER)}</textarea></div>
    <label class="check"><input type="checkbox" name="is_active" ${w.is_active !== false ? "checked" : ""}> Active</label>`;
}

function workflowFromForm(fd) {
  let definition;
  try { definition = JSON.parse(fd.get("definition")); }
  catch { throw new Error("Definition is not valid JSON"); }
  const chains = JSON.parse(fd.get("provider_chains") || "{}");
  if (Object.keys(chains).length) definition.provider_chains = chains;
  else delete definition.provider_chains;
  return {
    name: fd.get("name"), event_type: fd.get("event_type"),
    definition, is_active: fd.get("is_active") === "on",
  };
}

/* ═══ Providers ═══════════════════════════════════════════ */

const CHANNELS = ["email", "push", "sms", "in_app"];

function logoImg(p, cls = "provider-logo") {
  const url = p.catalog?.logo_url || p.logo_url;
  return url ? `<img class="${cls}" src="${esc(url)}" alt="">` : "";
}

function fieldInput(f, existing, isEdit) {
  const name = (f.secret ? "secret__" : "config__") + f.key;
  const req = f.required && !(f.secret && isEdit && existing.secrets_set?.includes(f.key)) ? "required" : "";
  const value = f.secret ? "" : (existing.config?.[f.key] ?? f.default ?? "");
  let input;
  if (f.kind === "boolean") {
    return `<label class="check"><input type="checkbox" name="${name}" ${value === true || value === "true" ? "checked" : ""}> ${esc(f.label)}</label>`;
  } else if (f.kind === "textarea") {
    input = `<textarea name="${name}" rows="6" spellcheck="false" autocomplete="off" ${req} placeholder="${f.secret && isEdit && existing.secrets_set?.includes(f.key) ? "••••••••  (saved — leave blank to keep)" : ""}"></textarea>`;
  } else if (f.kind === "select") {
    input = `<select name="${name}">${f.options.map(o => `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  } else {
    input = `<input name="${name}" type="${f.secret ? "password" : f.kind === "number" ? "number" : "text"}" autocomplete="${f.secret ? "new-password" : "off"}"
      value="${esc(value)}" ${req} placeholder="${f.secret && isEdit && existing.secrets_set?.includes(f.key) ? "••••••••  (saved — leave blank to keep)" : ""}">`;
  }
  return `<div class="field"><label>${esc(f.label)}${f.required ? " *" : ""}</label>${input}
    ${f.help ? `<div class="secret-hint">${esc(f.help)}</div>` : ""}</div>`;
}

function providerConfigForm(spec, p = {}) {
  const isEdit = !!p.id;
  return `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <img class="provider-logo" src="${esc(spec.logo_url)}" alt="">
      <div><div style="font-weight:600">${esc(spec.name)}</div><div class="muted">${esc(spec.description)}</div></div>
    </div>
    <div class="field"><label>Name</label>
      <input name="label" required maxlength="200" value="${esc(p.label || spec.name)}" placeholder="e.g. Marketing email">
      <div class="secret-hint">How you'll recognise this provider when adding it to workflows.</div></div>
    ${spec.builtin ? `<div class="muted" style="margin-bottom:12px">No setup needed.</div>` : ""}
    ${spec.fields.map(f => fieldInput(f, p, isEdit)).join("")}
    <label class="check"><input type="checkbox" name="is_active" ${p.is_active !== false ? "checked" : ""}> Active</label>`;
}

function providerFromConfigForm(fd, spec, existing = {}) {
  const config = {}, secrets = {};
  for (const f of spec.fields) {
    const key = (f.secret ? "secret__" : "config__") + f.key;
    if (f.kind === "boolean") { config[f.key] = fd.get(key) === "on"; continue; }
    const v = fd.get(key);
    if (f.secret) { if (v) secrets[f.key] = v; }       // blank = keep stored value
    else if (v !== null && v !== "") config[f.key] = f.kind === "number" ? Number(v) : v;
  }
  return {
    channel: spec.channel, name: spec.key, label: fd.get("label"),
    config, secrets, priority: existing.priority ?? 0,
    is_active: fd.get("is_active") === "on",
  };
}

async function pickCatalogProvider() {
  const catalog = await api("/provider-catalog");
  return new Promise(resolve => {
    const root = $("#modal-root");
    let channel = "all";
    const draw = () => {
      const items = catalog.filter(c => channel === "all" || c.channel === channel);
      root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" style="max-width:760px">
        <div class="modal-head"><div class="modal-title">Choose a provider</div>
          <button class="x-btn" data-close aria-label="Close">✕</button></div>
        <div class="modal-body">
          <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
            ${["all", ...CHANNELS].map(c => `<button type="button" class="btn sm ${c === channel ? "primary" : ""}" data-ch="${c}">${c === "all" ? "All" : chLabel(c)}</button>`).join("")}
          </div>
          <div class="catalog-grid">${items.map(c => `

        if (!spec) { toast(`'${p.name}' is no longer in the catalog`, "err"); return; }
        openModal("Edit provider", providerConfigForm(spec, p), {

async function refreshMe() {
  try {
    const me = await api("/auth/me");
    state.me = me;
    const sw = $("#tenant-switch");
    const keep = state.tenantId;
    sw.innerHTML = me.memberships.map(m =>
      `<option value="${esc(m.tenant_id)}" ${m.tenant_id === keep ? "selected" : ""}>${esc(m.tenant_name)}</option>`
    ).join("") || `<option value="">No tenants</option>`;
    if (!me.memberships.some(m => m.tenant_id === keep)) {
      state.tenantId = me.memberships[0]?.tenant_id ?? null;
      if (state.tenantId) localStorage.setItem("pulse.tenantId", state.tenantId);
    }
    buildNav();
  } catch {}
}

/* ═══ Auth, connection status + boot ══════════════════════ */

function setConn(ok) {
  $("#conn-dot").className = `conn-dot ${ok ? "ok" : "bad"}`;
  $("#conn-label").textContent = ok ? "API connected" : "API unreachable";
}

async function checkConn() {
  try {
    const res = await fetch("/health/", { credentials: "same-origin" });
    setConn(res.ok);
  } catch { setConn(false); }
}

function showLogin(message) {
  if (teardown) { try { teardown(); } catch {} teardown = null; }
  state.me = null;
  $("#app-layout").hidden = true;
  $("#login-screen").hidden = false;
  const err = $("#login-error");
  err.hidden = !message;
  if (message) err.textContent = message;
  $("#login-form input[name=email]").focus();
}

function enterApp(me) {
  state.me = me;
  const stored = localStorage.getItem("pulse.tenantId");
  const tenants = me.memberships;
  state.tenantId = tenants.some(m => m.tenant_id === stored) ? stored : (tenants[0]?.tenant_id ?? null);

  // Tenant switcher
  const sw = $("#tenant-switch");
  sw.innerHTML = tenants.map(m =>
    `<option value="${esc(m.tenant_id)}" ${m.tenant_id === state.tenantId ? "selected" : ""}>${esc(m.tenant_name)}</option>`
  ).join("") || `<option value="">No tenants</option>`;
  sw.onchange = () => {
    state.tenantId = sw.value;
    localStorage.setItem("pulse.tenantId", state.tenantId);
    buildNav();
    navigate();
  };

  // User chip + menu
  const name = me.full_name || me.email;
  $("#user-avatar").textContent = name.trim().slice(0, 1).toUpperCase();
  $("#user-name").textContent = name;
  $("#menu-email").textContent = me.email;
  $("#menu-role").textContent = me.is_platform_admin ? "Platform admin"
    : (currentMembership()?.role === "admin" ? "Tenant admin" : "Member");

  $("#login-screen").hidden = true;
  $("#app-layout").hidden = false;
  buildNav();
  navigate();
  checkConn();
}

$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const me = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
    });
    $("#login-error").hidden = true;
    e.target.reset();
    enterApp(me);
  } catch (err) {
    const box = $("#login-error");
    box.hidden = false;
    box.textContent = err.message;
  } finally { btn.disabled = false; }
});

const chip = $("#user-chip"), menu = $("#user-menu");
chip.addEventListener("click", e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
document.addEventListener("click", () => { menu.hidden = true; });

$("#logout-btn").addEventListener("click", async () => {
  try { await api("/auth/logout", { method: "POST" }); } catch {}
  showLogin();
});

$("#pw-btn").addEventListener("click", () => {
  menu.hidden = true;
  openModal("Change password", `
    <div class="field"><label>Current password</label><input name="current" type="password" required autocomplete="current-password"></div>
    <div class="field"><label>New password</label><input name="next" type="password" required minlength="8" autocomplete="new-password"></div>`, {
    submitLabel: "Update password",
    onSubmit: async fd => {
      await api("/auth/password", {
        method: "POST",
        body: JSON.stringify({ current_password: fd.get("current"), new_password: fd.get("next") }),
      });
      toast("Password updated", "ok");
    },
  });
});

(async function boot() {
  try {
    const me = await api("/auth/me");
    enterApp(me);
  } catch {
    showLogin();
  }
  setInterval(checkConn, 30000);
})();
</script>
</body>
</html>
