services:
  db:
      image: postgres:16-alpine
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=pulsedb
      ports:
        - '${PULSE_DB_PORT:-5423}:5432'
      volumes:
        - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis:7-alpine
      restart: always
      ports:
        - '${PULSE_REDIS_PORT:-6380}:6379'
      volumes:
        - redis_data:/data

  # Metrics/traces backend (OTLP). Opt in:  docker compose --profile observability up -d openobserve
  # Console: http://localhost:5080  (dev credentials below; change for anything shared)
  openobserve:
      image: o2cr.ai/openobserve/openobserve-enterprise:v1.0.4
      profiles: ['observability']
      restart: unless-stopped
      environment:
        - ZO_ROOT_USER_EMAIL=${PULSE_O2_EMAIL:-admin@pulse.local}
        - ZO_ROOT_USER_PASSWORD=${PULSE_O2_PASSWORD:-Pulse-Dev-2026!}
        - ZO_DATA_DIR=/data
      ports:
        - '${PULSE_O2_PORT:-5080}:5080'
      volumes:
        - openobserve_data:/data

  # The console. Opt in:  docker compose --profile app up -d --build web
  # Static files served by nginx (about 60 MB); PULSE_API_ORIGIN is where it proxies /api and /health.
  web:
      build:
        context: ./web
      environment:
        # Where the nginx in the image proxies /api and /health (read when the container starts).
        PULSE_API_ORIGIN: ${PULSE_API_ORIGIN:-http://host.docker.internal:9000}
      profiles: ['app']
      restart: unless-stopped
      ports:
        - '${PULSE_WEB_PORT:-3100}:3100'

volumes:
  openobserve_data:
  postgres_data:
  redis_data:
