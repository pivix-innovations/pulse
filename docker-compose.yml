services:
  db:
      image: postgres:16-alpine
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=pulsedb
      ports:
        - '${PULSE_DB_PORT:-5423}:5432'
      volumes:
        - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis:7-alpine
      restart: always
      ports:
        - '${PULSE_REDIS_PORT:-6380}:6379'
      volumes:
        - redis_data:/data

volumes:
  postgres_data:
  redis_data:
