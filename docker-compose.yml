services:
  db:
      image: postgres:16-alpine
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=pulsedb
      ports:
        - '${PULSE_DB_PORT:-5423}:5432'
      volumes:
        - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis:7-alpine
      restart: always
      ports:
        - '${PULSE_REDIS_PORT:-6380}:6379'
      volumes:
        - redis_data:/data

  # Metrics/traces backend (OTLP). Opt in:  docker compose --profile observability up -d openobserve
  # Console: http://localhost:5080  (dev credentials below; change for anything shared)
  openobserve:
      image: public.ecr.aws/zinclabs/openobserve:latest
      profiles: ['observability']
      restart: unless-stopped
      environment:
        - ZO_ROOT_USER_EMAIL=${PULSE_O2_EMAIL:-admin@pulse.local}
        - ZO_ROOT_USER_PASSWORD=${PULSE_O2_PASSWORD:-Pulse-Dev-2026!}
        - ZO_DATA_DIR=/data
      ports:
        - '${PULSE_O2_PORT:-5080}:5080'
      volumes:
        - openobserve_data:/data

volumes:
  openobserve_data:
  postgres_data:
  redis_data:
