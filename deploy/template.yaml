AWSTemplateFormatVersion: "2010-09-09"
Description: Pulse notification API - Lambda (FastAPI + Mangum) behind an API Gateway HTTP API.

Parameters:
  CodeBucket: {Type: String}
  CodeKey: {Type: String}
  DbHost: {Type: String}
  DbUser: {Type: String}
  DbPassword: {Type: String, NoEcho: true}
  DbName: {Type: String}
  RedisHost: {Type: String}
  RedisPort: {Type: String, Default: "6379"}
  RedisUser: {Type: String, Default: default}
  RedisPassword: {Type: String, NoEcho: true}
  SecretsKey: {Type: String, NoEcho: true}
  UnsubscribeKey: {Type: String, NoEcho: true}
  IngressApiKeys: {Type: String, NoEcho: true, Default: "{}", Description: 'JSON map of ingress API key to tenant UUID'}
  SentinelBaseUrl: {Type: String, Default: ""}
  EmailFrom: {Type: String, Default: no-reply@pulse-mailer.pivix.in}
  DomainName: {Type: String, Default: dev-pulse-api.pivix.in}
  CertificateArn: {Type: String, Default: "", Description: ACM cert ARN for DomainName; empty skips the custom domain}

Conditions:
  HasDomain: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !GetAtt LogGroup.Arn}
              - {Effect: Allow, Action: [ses:SendEmail, ses:SendRawEmail], Resource: "*"}

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: main.handler
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt Role.Arn
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          PULSE_APP__ENVIRONMENT: dev
          PULSE_APP__ALLOWED_ORIGINS: '["*"]'
          PULSE_DATABASE__DRIVER: postgresql+asyncpg
          PULSE_DATABASE__HOST: !Ref DbHost
          PULSE_DATABASE__PORT: "5432"
          PULSE_DATABASE__USERNAME: !Ref DbUser
          PULSE_DATABASE__PASSWORD: !Ref DbPassword
          PULSE_DATABASE__DB: !Ref DbName
          PULSE_DATABASE__SSL: "true"
          PULSE_DATABASE__ECHO: "false"
          PULSE_DATABASE__POOL_SIZE: "2"
          PULSE_DATABASE__MAX_OVERFLOW: "1"
          PULSE_DATABASE__POOL_TIMEOUT: "10"
          PULSE_DATABASE__POOL_RECYCLE: "300"
          PULSE_DATABASE__POOL_PRE_PING: "true"
          PULSE_REDIS__HOST: !Ref RedisHost
          PULSE_REDIS__PORT: !Ref RedisPort
          PULSE_REDIS__USERNAME: !Ref RedisUser
          PULSE_REDIS__PASSWORD: !Ref RedisPassword
          PULSE_REDIS__SSL: "true"
          PULSE_SECURITY__SECRETS_KEY: !Ref SecretsKey
          PULSE_SECURITY__UNSUBSCRIBE_KEY: !Ref UnsubscribeKey
          PULSE_SECURITY__INGRESS_API_KEYS: !Ref IngressApiKeys
          PULSE_API__PUBLIC_URL: !Sub https://${DomainName}
          PULSE_EMAIL__FROM_ADDRESS: !Ref EmailFrom
          PULSE_LOGGING__JSON: "true"
          PULSE_SENTINEL__BASE_URL: !Ref SentinelBaseUrl

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true

  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  Domain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - {CertificateArn: !Ref CertificateArn, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2}

  Mapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref Domain
      Stage: $default

Outputs:
  ApiEndpoint: {Value: !GetAtt Api.ApiEndpoint}
  CustomDomainTarget:
    Condition: HasDomain
    Description: Point a CNAME for the domain at this value
    Value: !GetAtt Domain.RegionalDomainName
